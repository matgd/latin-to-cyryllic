<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cyrillic Visual Mapper</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        >
    </head>
    <body>
        <div class="background-glob"></div>
        <div class="app-container">
            <header>
                <h1>Latin <span>⟷</span> Cyrillic</h1>
                <button id="theme-toggle" aria-label="Toggle Dark Mode">
                    <svg
                        class="sun-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78">
                        </line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg
                        class="moon-icon"
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                        >
                        </path>
                    </svg>
                </button>
            </header>

            <main>
                <div class="input-group">
                <div class="label-row">
                    <label for="input-text">Latin Input</label>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="input-text" placeholder="Type here (e.g. NXC IO)..." autofocus></textarea>
                    <button class="copy-btn" data-target="input-text" aria-label="Copy input">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <div class="arrow-divider">
                ↓
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="output-text">Cyrillic Output</label>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="output-text" readonly placeholder="Result appears here..."></textarea>
                    <button class="copy-btn" data-target="output-text" aria-label="Copy output">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                </div>
            </div>

            <div class="blyat-ometer-container">
                <div class="blyat-header">
                    <span>Rus Factor</span>
                    <span id="blyat-score">Silver I</span>
                </div>
                <div class="meter-track">
                    <div id="blyat-fill" class="meter-fill" style="width: 0%"></div>
                </div>
            </div>
            </main>

            <footer>
                <p>Visual Homoglyph Mapper</p>
            </footer>
        </div>
        <script src="script.js"></script>
    </body>
</html>
